  <body>
    <style>
      /* 首屏骨架：bundle 載入前先顯示，React 掛載後被取代 */
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:16px;background:#F0EBE4;color:#3A322B;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
      #boot .ring{width:36px;height:36px;border:2px solid rgba(58,50,43,.18);border-top-color:#3A322B;

      @keyframes bspin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#boot .ring{animation:none}}
    </style>
    <div id="root"><div id="boot">
